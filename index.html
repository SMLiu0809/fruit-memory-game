    'use strict'; // 👑 升級 3：強制啟用嚴格模式，根絕隱藏 Bug

    let audioCtx;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') return; // 防呆設計
      
      const osc = audioCtx.createOscillator(); 
      const gain = audioCtx.createGain();
      osc.connect(gain); 
      gain.connect(audioCtx.destination);
      
      if (type === 'flip') { 
        osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08); 
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); 
      } else if (type === 'match') { 
        osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); 
      } else if (type === 'win') { 
        osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2); 
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); 
      } else if (type === 'pop') { 
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05); 
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05); 
      }
    }

    function getRankIndex(pts) {
      if (pts >= 10000) return 4; if (pts >= 5000) return 3; if (pts >= 2000) return 2; if (pts >= 500) return 1; return 0;
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('fruit_memory_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('lang-' + lang).classList.add('active');
      renderUI();
    }

    function renderUI() {
      const D = I18N[currentLang];
      document.getElementById('ui-main-title').innerText = D.main_title;
      document.getElementById('secret-badge').innerText = D.designer;
      document.getElementById('player-total-points').innerText = D.pts_label + userTotalPoints;
      document.getElementById('player-title').innerText = D.ranks[getRankIndex(userTotalPoints)];
      document.getElementById('ui-pts-desc').innerText = D.pts_desc;
      document.getElementById('ui-select-hint').innerText = D.select_hint;
      document.getElementById('ui-age-label').innerText = D.age_label;
      document.getElementById('ui-lvl-label').innerText = D.lvl_label;
      document.getElementById('btn-next-step').innerText = D.btn_next_step;
      document.getElementById('ui-visitors').innerText = D.visitors;
      
      document.getElementById('ui-tut-title').innerText = D.tut_title;

      document.getElementById('demo-fruit-2').innerText = FRUITS[5][currentLang];

      document.getElementById('ui-tut-mission').innerHTML = D.tut_mission;
      document.getElementById('btn-start-game').innerText = D.btn_start_game;
      document.getElementById('btn-back-home').innerText = D.btn_back_home;
      document.getElementById('btn-restart-hud').innerText = D.hud_restart;
      
      const ageSelect = document.getElementById('age-group-select');
      const curAge = ageSelect.value || 3;
      ageSelect.innerHTML = D.ages.map((a, i) => `<option value="${i}">${a}</option>`).join('');
      ageSelect.value = curAge;

      const lvlSelect = document.getElementById('level-select');
      const curLvl = lvlSelect.value || currentLevel;
      lvlSelect.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        if (i <= maxUnlockedLevel) {
          let stageName = i <= 4 ? D.stage_names[0] : i <= 7 ? D.stage_names[1] : D.stage_names[2];
          opt.innerText = D.lvl_unlocked.replace('{0}', i).replace('{1}', stageName);
        } else {
          opt.innerText = D.lvl_locked.replace('{0}', i); opt.disabled = true;
        }
        if (i === parseInt(curLvl)) opt.selected = true;
        lvlSelect.appendChild(opt);
      }
      renderVisitorCounter();
    }

    function secretPreviewTrigger() {
      initAudio();
      secretClicks++; playSound('pop'); 
      const badge = document.getElementById('secret-badge');
      badge.classList.add('clicked');
      setTimeout(() => { badge.classList.remove('clicked'); }, 150);
      clearTimeout(secretTimer);
      secretTimer = setTimeout(() => { secretClicks = 0; }, 2000);
      if (secretClicks >= 3) { secretClicks = 0; previewFinalScreen(); }
    }

    function renderVisitorCounter() {
      let baseCount = parseInt(localStorage.getItem('fruit_memory_visitor_count')) || 1688;
      // 👑 升級 3：嚴格防呆，確保只在空節點時才增加虛擬流量，防止切換語言時暴增
      const grid = document.getElementById('visitor-counter-grid');
      if(grid.childElementCount === 0){
         baseCount += Math.floor(Math.random() * 3) + 1; 
         localStorage.setItem('fruit_memory_visitor_count', baseCount);
      }
      const D = I18N[currentLang];
      let numStr = baseCount.toString().padStart(8, '0');
      grid.innerHTML = '';
      for(let i = 0; i < 8; i++) {
        grid.innerHTML += `<div class="digit-box"><div class="digit-num">${numStr[i]}</div><div class="digit-label">${D.counter_places[i]}</div></div>`;
      }
    }

    window.onload = () => { setLanguage(currentLang); document.getElementById('start-modal').style.display = 'flex'; };

    function showTutorial() {
      initAudio(); playSound('pop');
      userAgeGroupIdx = parseInt(document.getElementById('age-group-select').value);
      currentLevel = parseInt(document.getElementById('level-select').value);
      startLevel = currentLevel; 
      document.getElementById('start-modal').style.display = 'none';
      document.getElementById('tutorial-modal').style.display = 'flex';
    }
    
    function backToStart() {
      playSound('pop');
      document.getElementById('tutorial-modal').style.display = 'none';
      document.getElementById('start-modal').style.display = 'flex';
    }

    function startGame() {
      totalFlips = 0; totalTime = 0;
      document.getElementById('tutorial-modal').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      playSound('pop'); initLevel();
    }

    function previewFinalScreen() {
      initAudio(); playSound('win');
      document.getElementById('start-modal').style.display = 'none';
      startLevel = 1; totalTime = 125; totalFlips = 196; 
      const D = I18N[currentLang];
      const cert = D.certs[0];
      const finalBonus = 1000; 
      
      document.getElementById('ui-fin-title').innerText = D.fin_title;
      document.getElementById('final-earned-points').innerText = D.fin_bonus.replace('{0}', finalBonus);
      document.getElementById('final-stats').innerText = D.fin_stats.replace('{0}', startLevel).replace('{1}', totalTime).replace('{2}', totalFlips);
      document.getElementById('certificate-title').innerText = cert.t;
      document.getElementById('certificate-msg').innerText = cert.m;
      document.getElementById('btn-return-home').innerText = D.btn_return_home;
      document.getElementById('result-modal').style.display = 'flex';
    }

    function updateHUD() {
      const D = I18N[currentLang];
      document.getElementById('hud-level').innerText = D.hud_lvl.replace('{0}', currentLevel);
      document.getElementById('hud-time').innerText = D.hud_time.replace('{0}', totalTime);
      document.getElementById('hud-flips').innerText = D.hud_flips.replace('{0}', totalFlips);
      document.getElementById('hud-score').innerText = D.hud_score.replace('{0}', userTotalPoints);
    }

    function initLevel() {
      isLocked = true; flippedCards = []; matchedPairs = 0;
      clearInterval(levelTimer); clearInterval(cdTimer);

      const pairsNeeded = LEVELS[currentLevel - 1];
      let stageIdx = currentLevel <= 4 ? 0 : currentLevel <= 7 ? 1 : 2;
      let preMemoTime = AGE_CONFIGS[userAgeGroupIdx].times[stageIdx];
      updateHUD();
      
      let selectedFruits = FRUITS.slice(0, pairsNeeded);
      let deck = [...selectedFruits, ...selectedFruits];
      
      // 👑 升級 2：Fisher-Yates 發牌官級絕對隨機洗牌演算法
      for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';
      deck.forEach((fruit) => {
        const card = document.createElement('div');
        card.className = 'card flipped'; 
        card.dataset.name = fruit[currentLang]; // 依賴當前語言作為配對依據，嚴格且安全
        card.innerHTML = `<div class="card-face card-front">❓</div><div class="card-face card-back"><div class="card-emoji">${fruit.e}</div><div class="card-text">${fruit[currentLang]}</div></div>`;
        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
      });

      const cdDisplay = document.getElementById('countdown-display');
      cdDisplay.style.opacity = 1; cdDisplay.innerText = preMemoTime;
      let timeLeft = preMemoTime;

      cdTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) { cdDisplay.innerText = timeLeft; playSound('pop'); } 
        else {
          clearInterval(cdTimer); cdDisplay.style.opacity = 0;
          document.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
          setTimeout(() => { isLocked = false; startPlayTimer(); }, 450);
        }
      }, 1000);
    }

    function startPlayTimer() {
      levelTimer = setInterval(() => { totalTime++; updateHUD(); }, 1000);
    }

    function flipCard(card) {
      if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      playSound('flip'); card.classList.add('flipped'); flippedCards.push(card); totalFlips++;
      updateHUD();
      if (flippedCards.length === 2) { isLocked = true; checkMatch(); }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.dataset.name === c2.dataset.name) {
        playSound('match'); c1.classList.add('matched'); c2.classList.add('matched');
        flippedCards = []; matchedPairs++;
        if (matchedPairs === LEVELS[currentLevel - 1]) {
          clearInterval(levelTimer); isLocked = true; setTimeout(levelComplete, 600);
        } else { isLocked = false; }
      } else {
        setTimeout(() => { c1.classList.remove('flipped'); c2.classList.remove('flipped'); flippedCards = []; isLocked = false; }, 800);
      }
    }

    function levelComplete() {
      playSound('win');
      const D = I18N[currentLang];
      let basePoints = currentLevel * 50;
      let earned = basePoints + Math.max(0, (LEVELS[currentLevel - 1] * 4 - totalFlips) * 5); 
      userTotalPoints += earned;
      localStorage.setItem('fruit_memory_points', userTotalPoints);
      updateHUD();

      let nextLvl = currentLevel + 1;
      if (nextLvl <= 10 && nextLvl > maxUnlockedLevel) {
          maxUnlockedLevel = nextLvl;
          localStorage.setItem('fruit_memory_max_level', maxUnlockedLevel);
      }
      
      if (currentLevel < 10) { 
        document.getElementById('ui-level-cleared').innerText = D.lvl_cleared;
        document.getElementById('level-earned-points').innerText = D.lvl_earned.replace('{0}', earned);
        document.getElementById('btn-next-level').innerText = D.btn_next_lvl;
        const randomMsg = D.reminders[Math.floor(Math.random() * D.reminders.length)];
        document.getElementById('rest-reminder-text').innerText = randomMsg;
        document.getElementById('level-modal').style.display = 'flex'; 
      } else { showFinalResult(); }
    }

    function nextLevel() { document.getElementById('level-modal').style.display = 'none'; currentLevel++; setTimeout(() => { initLevel(); }, 50); }

    function showFinalResult() {
      document.getElementById('hud').style.display = 'none';
      document.getElementById('game-container').style.display = 'none';
      const D = I18N[currentLang];
      
      let targetBase = 0;
      for (let i = startLevel - 1; i < 10; i++) { targetBase += LEVELS[i] * 12; }
      const penaltyScore = totalTime + (totalFlips * 1.5);
      const ratio = penaltyScore / targetBase;
      let gradeIndex = 9; 
      if (ratio < 0.50) gradeIndex = 0; else if (ratio < 0.60) gradeIndex = 1; else if (ratio < 0.70) gradeIndex = 2; else if (ratio < 0.85) gradeIndex = 3; else if (ratio < 1.00) gradeIndex = 4; else if (ratio < 1.25) gradeIndex = 5; else if (ratio < 1.50) gradeIndex = 6; else if (ratio < 1.75) gradeIndex = 7; else if (ratio < 2.00) gradeIndex = 8;
      
      const cert = D.certs[gradeIndex];
      let finalBonus = (10 - gradeIndex) * 100;
      userTotalPoints += finalBonus;
      localStorage.setItem('fruit_memory_points', userTotalPoints);
      
      document.getElementById('ui-fin-title').innerText = D.fin_title;
      document.getElementById('final-earned-points').innerText = D.fin_bonus.replace('{0}', finalBonus);
      document.getElementById('final-stats').innerText = D.fin_stats.replace('{0}', startLevel).replace('{1}', totalTime).replace('{2}', totalFlips);
      document.getElementById('certificate-title').innerText = cert.t;
      document.getElementById('certificate-msg').innerText = cert.m;
      document.getElementById('btn-return-home').innerText = D.btn_return_home;
      document.getElementById('result-modal').style.display = 'flex';
    }
  </script>
</body>
</html>
